<div class="abhi-container">
  <!-- Top HUD Header -->
  <app-hud-header
    [isConnected]="isConnected"
    [netSpeedText]="netSpeedText"
    [isSwarmOpen]="isSwarmDrawerOpen"
    [isToolsOpen]="isToolsDrawerOpen"
    [isEvolutionOpen]="isEvolutionModalOpen"
    [isPerceptionOpen]="isPerceptionModalOpen"
    [isMediaOpen]="isMediaModalOpen"
    [storageAlert]="storageAlert"
    (toggleSwarm)="toggleSwarmDrawer()"
    (toggleTools)="toggleToolsDrawer()"
    (toggleEvolution)="toggleEvolution()"
    (togglePerception)="togglePerception()"
    (toggleMedia)="toggleMedia()"
    (expandStorage)="onExpandStorage()"
    (screenshotCaptured)="onScreenshotCaptured($event)"
  ></app-hud-header>

  <!-- Mobile View Switcher (Visible on < 992px) -->
  <div *ngIf="isMobile" class="mobile-nav-bar">
    <button class="mob-btn" [class.active]="mobileView === 'diagnostics'" (click)="setMobileView('diagnostics')">
      <i class="fas fa-microchip"></i> OS TELEMETRY
    </button>
    <button class="mob-btn" [class.active]="mobileView === 'chat'" (click)="setMobileView('chat')">
      <i class="fas fa-sun"></i> 4K CORE HUD
    </button>
    <button class="mob-btn" [class.active]="isSwarmDrawerOpen" (click)="toggleSwarmDrawer()">
      <i class="fas fa-users-gear"></i> DEITY SWARM
    </button>
  </div>

  <!-- Main Workspace Grid -->
  <main class="workspace-grid" [class.mobile-mode]="isMobile">
    <!-- LEFT PANEL: System Diagnostics & OS Controls -->
    <aside class="col-panel left-col" [class.mob-hidden]="isMobile && mobileView !== 'diagnostics'">
      <app-system-diagnostics
        [telemetry]="telemetry"
        (appLaunched)="onAppLaunched($event)"
      ></app-system-diagnostics>
    </aside>

    <!-- CENTER / WIDE PANEL: 4K Hologram Avatar & Chat HUD -->
    <section class="center-column" [class.mob-hidden]="isMobile && mobileView !== 'chat'">
      <div class="hologram-wrapper">
        <app-hologram-viewport
          [userMood]="telemetry?.emotion?.mood || 'focused'"
        ></app-hologram-viewport>
      </div>
      <div class="chat-wrapper">
        <app-chat-console
          [selectedAgent]="selectedAgentId"
          (agentResponse)="onAgentResponse($event)"
        ></app-chat-console>
      </div>
    </section>
  </main>

  <!-- MODAL / OVERLAY BACKDROP -->
  <div class="drawer-backdrop" 
       *ngIf="isSwarmDrawerOpen || isToolsDrawerOpen || isEvolutionModalOpen || isPerceptionModalOpen || isMediaModalOpen" 
       (click)="closeAllDrawers()">
  </div>

  <!-- MODAL 1: EVOLUTION MATRIX MODAL -->
  <div class="cyber-modal evolution-modal" *ngIf="isEvolutionModalOpen">
    <div class="modal-top">
      <button class="btn-close-modal" (click)="toggleEvolution()">
        <i class="fas fa-times"></i> CLOSE MATRIX
      </button>
    </div>
    <app-evolution-graph></app-evolution-graph>
  </div>

  <!-- MODAL 2: MULTI-MODAL PERCEPTION SENSORS MODAL -->
  <div class="cyber-modal perception-modal" *ngIf="isPerceptionModalOpen">
    <div class="modal-top">
      <button class="btn-close-modal" (click)="togglePerception()">
        <i class="fas fa-times"></i> CLOSE SENSORS
      </button>
    </div>
    <app-perception-hud></app-perception-hud>
  </div>

  <!-- MODAL 3: GENERATIVE MEDIA LAB MODAL -->
  <div class="cyber-modal media-modal" *ngIf="isMediaModalOpen">
    <div class="modal-top">
      <button class="btn-close-modal" (click)="toggleMedia()">
        <i class="fas fa-times"></i> CLOSE MEDIA LAB
      </button>
    </div>
    <app-media-hub></app-media-hub>
  </div>

  <!-- SLIDE-OUT CYBER DRAWER: MULTI-AGENT SWARM -->
  <aside class="cyber-drawer" [class.open]="isSwarmDrawerOpen">
    <div class="drawer-header">
      <div class="drawer-title">
        <i class="fas fa-users-gear glow-gold"></i>
        <span>PURANIC DEITY SWARM & CLONE</span>
      </div>
      <button class="btn-close-drawer" (click)="toggleSwarmDrawer()">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <div class="drawer-body">
      <app-multi-agent-swarm
        [agents]="agents"
        [selectedAgentId]="selectedAgentId"
        (agentSelected)="onAgentSelected($event)"
      ></app-multi-agent-swarm>
    </div>
  </aside>

  <!-- SLIDE-OUT CYBER DRAWER: WORKSPACE TOOLS -->
  <aside class="cyber-drawer" [class.open]="isToolsDrawerOpen">
    <div class="drawer-header">
      <div class="drawer-title">
        <i class="fas fa-cubes glow-cyan"></i>
        <span>WORKSPACE VAULT & TOOLS</span>
      </div>
      <button class="btn-close-drawer" (click)="toggleToolsDrawer()">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <div class="drawer-body">
      <div class="tabs-nav">
        <button class="tab-btn" [class.active]="activeTab === 'contacts'" (click)="setTab('contacts')">
          <i class="fab fa-whatsapp"></i> CONTACTS
        </button>
        <button class="tab-btn" [class.active]="activeTab === 'storage'" (click)="setTab('storage')">
          <i class="fas fa-vault"></i> 200GB VAULT
        </button>
        <button class="tab-btn" [class.active]="activeTab === 'processes'" (click)="setTab('processes')">
          <i class="fas fa-shield-halved"></i> PROCESSES
        </button>
        <button class="tab-btn" [class.active]="activeTab === 'terminal'" (click)="setTab('terminal')">
          <i class="fas fa-terminal"></i> SHELL
        </button>
      </div>

      <div class="tab-content" [class.active]="activeTab === 'contacts'">
        <app-contacts-manager></app-contacts-manager>
      </div>

      <div class="tab-content" [class.active]="activeTab === 'storage'">
        <app-storage-vault></app-storage-vault>
      </div>

      <div class="tab-content" [class.active]="activeTab === 'processes'">
        <app-process-manager></app-process-manager>
      </div>

      <div class="tab-content" [class.active]="activeTab === 'terminal'">
        <app-terminal-runner></app-terminal-runner>
      </div>
    </div>
  </aside>

  <!-- Bottom Status Bar -->
  <app-hud-footer></app-hud-footer>
</div>
