<div class="chat-container">
  <div class="panel-header">
    <div class="panel-title">
      <i class="fas fa-om" style="color:var(--neon-gold); margin-right:6px;"></i>
      <span>ABHI COGNITIVE SUTRADHAR</span>
    </div>
    <span class="active-agent-badge">INVOKED DEITY: [{{ selectedAgent | uppercase }}]</span>
  </div>

  <div class="chat-messages" #chatScroll>
    <div *ngFor="let msg of messages" class="chat-bubble" [ngClass]="msg.role === 'user' ? 'user' : 'abhi'">
      <div class="bubble-sender">
        <i class="fas" [ngClass]="msg.role === 'user' ? 'fa-user' : 'fa-sun'" style="margin-right:4px;"></i>
        <span>{{ msg.sender | uppercase }}</span>
      </div>
      <div class="bubble-body">{{ msg.content }}</div>

      <div *ngIf="msg.imagePreview" style="margin-top:8px;">
        <img [src]="msg.imagePreview" style="max-width:100%; border-radius:6px; border:1px solid var(--neon-gold);" />
      </div>

      <div *ngIf="msg.toolCall" class="tool-chip">
        <i class="fas fa-bolt" style="color:var(--neon-gold);"></i> 
        <span>Deity Action: <strong>{{ msg.toolCall.tool }}</strong></span>
      </div>
    </div>
  </div>

  <form class="chat-input-bar" (ngSubmit)="sendMessage()">
    <button type="button" class="btn-mic" [class.recording]="audioService.isListening" (click)="toggleMic()" title="Voice Dictation">
      <i class="fas fa-microphone"></i>
    </button>
    <input 
      type="text" 
      class="chat-input" 
      [(ngModel)]="inputText" 
      name="inputText" 
      placeholder="Ask Abhi or command deities (e.g. 'Set volume 60', 'Launch VS Code', 'Purge RAM', 'Search Saraswati vault')..." 
      autocomplete="off"
    >
    <button type="submit" class="btn-cyber"><i class="fas fa-paper-plane"></i> TRANSMIT</button>
  </form>
</div>
