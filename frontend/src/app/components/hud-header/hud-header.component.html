<header class="hud-header">
  <div class="brand">
    <div class="brand-icon-box">
      <i class="fas fa-sun brand-icon"></i>
    </div>
    <div>
      <div class="brand-title">JARVIS AIOS</div>
      <div class="brand-subtitle">LOCAL-FIRST AUTONOMOUS COGNITIVE OS & AI CLONE</div>
    </div>
  </div>

  <div class="hud-status-bar">
    <div class="status-badge" [ngClass]="isConnected ? 'online' : 'busy'">
      <div class="indicator"></div>
      <span>LLM: QWEN3:8B (100% GPU)</span>
    </div>
    <div class="status-badge online">
      <i class="fas fa-fingerprint" style="color:#76ff03;"></i>
      <span>CLONE: 🧬 SELF-LEARNING</span>
    </div>
    <div class="status-badge online">
      <i class="fas fa-network-wired" style="color:var(--neon-cyan);"></i>
      <span>{{ netSpeedText }}</span>
    </div>
  </div>

  <div class="hud-actions">
    <!-- MULTI-AGENT SWARM TOGGLE BUTTON -->
    <button class="btn-cyber glow-gold" [class.active]="isSwarmOpen" (click)="onToggleSwarm()">
      <i class="fas fa-users-gear"></i>
      <span>{{ isSwarmOpen ? 'CLOSE SWARM' : '🤖 MULTI-AGENT SWARM' }}</span>
    </button>

    <!-- QUICK TOOLS DRAWER BUTTON -->
    <button class="btn-cyber glow-cyan" [class.active]="isToolsOpen" (click)="onToggleTools()">
      <i class="fas fa-cubes"></i>
      <span>{{ isToolsOpen ? 'CLOSE TOOLS' : '⚡ WORKSPACE TOOLS' }}</span>
    </button>

    <button class="btn-cyber" [class.active]="audioService.speechEnabled" (click)="toggleVoice()">
      <i class="fas" [ngClass]="audioService.speechEnabled ? 'fa-volume-high' : 'fa-volume-xmark'"></i>
      <span>VOICE: {{ audioService.speechEnabled ? 'ON' : 'OFF' }}</span>
    </button>
    <button class="btn-cyber" (click)="takeScreenshot()">
      <i class="fas fa-camera"></i> CAPTURE
    </button>
    <button class="btn-cyber danger" (click)="lockWorkstation()">
      <i class="fas fa-shield-halved"></i> LOCK
    </button>
  </div>
</header>
