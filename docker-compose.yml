version: '3.8'

services:
  jarvis-aios:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jarvis_aios
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=qwen3:8b
    volumes:
      - ./database:/app/database
    extra_hosts:
      - "host.docker.internal:host-gateway"
